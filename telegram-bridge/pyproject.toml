[project]
name = "codex-telegram-bridge"
version = "0.1.0"
description = "One local Telegram chat, one existing Codex Desktop thread"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.22,<4", "aiohttp>=3.12,<4", "python-dotenv>=1.1,<2"]

[project.scripts]
tg-bridge = "tg_bridge.cli:main"
tg-send = "tg_bridge.cli:send"
tg-send-file = "tg_bridge.cli:send_file"
tg-history = "tg_bridge.cli:history"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_bridge"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "jsonschema>=4,<5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
